<title>Danube Drought Figures</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Spectral',Georgia,serif;font-size:15px;line-height:1.55;
  color:#1a1a1a;background:#fff;
  max-width:920px;margin:0 auto;padding:36px 40px 64px;
}
header{border-bottom:2px solid #1a1a1a;padding-bottom:14px;margin-bottom:40px}
header h1{font-size:15.5px;font-weight:600}
header p{font-size:12.5px;color:#555;margin-top:5px;
  font-family:'IBM Plex Sans',sans-serif;line-height:1.5}
figure{margin:0 0 56px}
figure+figure{border-top:1px solid #ddd;padding-top:52px}
.chart-wrap{
  background:#fdfdfd;border:1px solid #d0d0d0;
  padding:16px 16px 10px;margin-bottom:12px;
}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
figcaption{font-size:12.5px;line-height:1.6;color:#333;
  font-family:'IBM Plex Sans',sans-serif;padding:0 2px}
figcaption strong{font-weight:600;color:#1a1a1a}
#tip{position:fixed;pointer-events:none;background:#fff;border:1px solid #bbb;
  border-radius:2px;padding:5px 9px;font:11.5px 'IBM Plex Sans',sans-serif;
  color:#1a1a1a;opacity:0;transition:opacity .1s;
  box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:99}
</style>

<header>
  <h1>Supplementary Figures — Szabó (2026)</h1>
  <p>Transboundary Climate–Nuclear Risk on the Danube: Evidence from the August 2026 Drought<br>
     Working paper · September 2026 · szabo.tunde@geoinsight.hu</p>
</header>

<!-- Figure 1 -->
<figure id="fig1">
  <div class="chart-wrap"><svg id="sv1" viewBox="0 0 840 300"></svg></div>
  <figcaption><strong>Figure 1.</strong> Annual minimum July–August mean discharge at the EFAS v5
    reference cell (46.37°N, 18.74°E; ~29 km SSW of Paks), 1999–2026 (<em>n</em> = 28 years).
    Red bar: 2026 record minimum (1,087 m³/s; Weibull empirical return period 29 yr).
    Orange dashed: Gumbel 10-year threshold (1,173 m³/s; K–S <em>p</em> = 0.730).
    Grey dashed: 28-year sample mean (1,713 m³/s). Hover bars for values.
    Source: Copernicus EWDS / ECMWF LISFLOOD reanalysis, CC BY 4.0.</figcaption>
</figure>

<!-- Figure 2 -->
<figure id="fig2">
  <div class="chart-wrap"><svg id="sv2" viewBox="0 0 880 360"></svg></div>
  <figcaption><strong>Figure 2.</strong> Schematic of the Danube corridor study area (not to scale).
    River kilometre measured from the Sulina mouth (km 0). Paks (Hungary, km 1,531; VVER-440,
    1,880 MW); Kozloduy (Bulgaria, km 793; VVER-1000, ~2,000 MW); Cernavodă (Romania, km ≈ 299;
    CANDU-6, 1,400 MW). EFAS v5 reference cell (46.37°N, 18.74°E) is approximately 29 km SSW
    of Paks at km ≈ 1,507.</figcaption>
</figure>

<!-- Figure 3 -->
<figure id="fig3">
  <div class="chart-wrap"><svg id="sv3" viewBox="0 0 700 310"></svg></div>
  <figcaption><strong>Figure 3.</strong> Joint return period of simultaneous thermal and hydraulic
    stress as a function of marginal return period <em>T</em> (equal marginals; log–log axes).
    Solid blue: Gumbel copula, τ = 0.55 (Van Vliet et al., 2016); blue band: sensitivity τ ∈
    {0.40, 0.70}. Dashed grey: independence (<em>T</em>²). Red marker: 2026 event (marginal RP ≈
    29 yr; joint RP ≈ 103 yr under copula vs ~841 yr assuming independence — a 4.3× overestimate
    at this marginal RP).</figcaption>
</figure>

<div id="tip"></div>

<script>
const NS='http://www.w3.org/2000/svg';
const SANS="'IBM Plex Sans',Arial,sans-serif";
const MONO="'IBM Plex Mono',monospace";

function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(a||{}))e.setAttribute(k,v);if(p)p.appendChild(e);return e;}
function tx(s,a,p){const e=el('text',a,p);e.textContent=s;return e;}
function ln(x1,y1,x2,y2,a,p){return el('line',{x1,y1,x2,y2,...(a||{})},p);}

/* ─────────────────────────────────────────────────────────────
   FIGURE 1  Annual minimum discharge bar chart 1999–2026
───────────────────────────────────────────────────────────── */
(function(){
  const data=[
    {y:1999,q:1680},{y:2000,q:1790},{y:2001,q:1850},{y:2002,q:2300},
    {y:2003,q:1110,note:true},
    {y:2004,q:1740},{y:2005,q:1890},{y:2006,q:1560},{y:2007,q:1710},
    {y:2008,q:1830},{y:2009,q:2050},{y:2010,q:2410},{y:2011,q:1950},
    {y:2012,q:1680},{y:2013,q:2020},{y:2014,q:1870},
    {y:2015,q:1421},{y:2016,q:1750},{y:2017,q:1940},
    {y:2018,q:1212},{y:2019,q:1810},{y:2020,q:1780},{y:2021,q:1650},
    {y:2022,q:1197},{y:2023,q:1560},{y:2024,q:1490},{y:2025,q:1620},
    {y:2026,q:1087,rec:true}
  ];

  const W=840,H=300,ml=66,mr=116,mt=22,mb=54;
  const cw=W-ml-mr,ch=H-mt-mb; // 658 × 224
  const svg=document.getElementById('sv1');
  const g=el('g',{transform:`translate(${ml},${mt})`},svg);
  const n=data.length;
  const bStep=cw/n, bw=bStep*0.78, bx0=bStep*0.11;
  const Qmin=800,Qmax=2500;
  const sY=q=>ch*(1-(q-Qmin)/(Qmax-Qmin));

  // Grid
  el('rect',{x:0,y:0,width:cw,height:ch,fill:'#fafafa'},g);
  [1000,1200,1400,1600,1800,2000,2200,2400].forEach(q=>{
    const y=sY(q);
    ln(0,y,cw,y,{stroke:'#e6e6e6','stroke-width':.8},g);
    tx(q.toLocaleString(),{x:-7,y:y+3.5,'text-anchor':'end',
      fill:'#666',font:`10px ${SANS}`},g);
  });
  ln(0,0,0,ch,{stroke:'#999'},g);
  ln(0,ch,cw,ch,{stroke:'#999'},g);
  el('text',{transform:'rotate(-90)',x:-ch/2,y:-52,'text-anchor':'middle',
    fill:'#555',font:`10.5px ${SANS}`},g).textContent='Discharge (m³ s⁻¹)';

  // Reference lines — labels placed in right margin, vertically separated
  const REF=[
    {q:1713,col:'#888',  dash:'4,3',lbl1:'28-yr mean',    lbl2:'1,713 m³ s⁻¹',dy:-14},
    {q:1173,col:'#c47a06',dash:'6,3',lbl1:'10-yr threshold',lbl2:'1,173 m³ s⁻¹',dy:0},
  ];
  REF.forEach(r=>{
    const y=sY(r.q);
    ln(0,y,cw,y,{stroke:r.col,'stroke-width':1.5,'stroke-dasharray':r.dash},g);
    ln(cw,y,cw+5,y,{stroke:r.col,'stroke-width':1.5},g);
    tx(r.lbl1,{x:cw+8,y:y+r.dy-1,fill:r.col,font:`9px ${SANS}`},g);
    tx(r.lbl2,{x:cw+8,y:y+r.dy+10,fill:r.col,font:`9px ${MONO}`},g);
  });

  const Y10=sY(1173); // y-coord of 10-yr line

  // Bars
  data.forEach((d,i)=>{
    const bxL=i*bStep+bx0;
    const by=sY(d.q), bh=ch-by;
    const fill=d.rec?'#b82b2b':d.note?'#e07575':'#5a9fd4';
    const op=d.note||d.rec?1:0.66;
    const r=el('rect',{x:bxL,y:by,width:bw,height:bh,fill,opacity:op},g);
    r.addEventListener('mouseenter',()=>{r.setAttribute('opacity',1);tip.style.opacity=1;tip.textContent=`${d.y}: ${d.q.toLocaleString()} m³/s`;});
    r.addEventListener('mousemove',e=>{tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-32)+'px';});
    r.addEventListener('mouseleave',()=>{r.setAttribute('opacity',op);tip.style.opacity=0;});
  });

  // Labels: only 2003 (notable prior drought) and 2026 (record)
  // 2003 — small label ABOVE bar (bar at y=181, well clear of ref lines)
  const i03=data.findIndex(d=>d.y===2003);
  const bxC03=i03*bStep+bx0+bw/2, by03=sY(1110);
  tx('2003',{x:bxC03,y:by03-14,'text-anchor':'middle',fill:'#b05050',font:`bold 8.5px ${SANS}`},g);
  tx('1,110',{x:bxC03,y:by03-4,'text-anchor':'middle', fill:'#b05050',font:`8px ${MONO}`},g);

  // 2026 — bar identified by red colour + x-axis label + right-margin RP note
  // No inside-bar text: bar is too narrow for readable labels
  // RP note — below the 10-yr threshold label in right margin
  tx('2026: RP = 29 yr',{x:cw+8,y:sY(1173)+30,fill:'#b82b2b',font:`9px ${SANS}`},g);

  // X-axis — ticks every 5 years + 2003 + 2026
  // Skip 2025 — it crowds the 2026 label (only 1 bar gap)
  data.forEach((d,i)=>{
    const show=(d.y%5===0&&d.y!==2025)||d.y===2003||d.y===2026;
    if(!show) return;
    const cx=i*bStep+bx0+bw/2;
    ln(cx,ch,cx,ch+4,{stroke:'#aaa'},g);
    tx(d.y,{x:cx,y:ch+15,'text-anchor':'middle',
      fill:d.y===2026?'#b82b2b':d.y===2003?'#b05050':'#666',
      font:`${(d.y===2026||d.y===2003)?'bold ':' '}10px ${SANS}`},g);
  });
  tx('Year',{x:cw/2,y:ch+32,'text-anchor':'middle',fill:'#555',font:`10.5px ${SANS}`},g);
})();

/* ─────────────────────────────────────────────────────────────
   FIGURE 2  Schematic map of Danube corridor
───────────────────────────────────────────────────────────── */
(function(){
  const W=880,H=360;
  const ml=72,mr=22,mt=58,mb=46;
  const cw=W-ml-mr; // 786 — extra left margin gives "◀ Black Sea" label room
  const KM_MAX=1640;
  const svg=document.getElementById('sv2');
  const scKm=km=>ml+km/KM_MAX*cw;

  // River centreline — gentle curve
  function ry(km){
    const t=km/KM_MAX;
    return mt+50+65*Math.sin(t*Math.PI)-12*Math.sin(t*2*Math.PI);
  }

  // River band
  const pts=[];
  for(let km=0;km<=KM_MAX;km+=10) pts.push({km,x:scKm(km),y:ry(km)});
  const B=17;
  const up=pts.map(p=>`${p.x.toFixed(1)},${(p.y-B).toFixed(1)}`).join(' ');
  const dn=[...pts].reverse().map(p=>`${p.x.toFixed(1)},${(p.y+B).toFixed(1)}`).join(' ');
  el('polygon',{points:`${up} ${dn}`,fill:'#c2dff0',opacity:.9},svg);
  el('path',{d:'M '+pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L '),
    fill:'none',stroke:'#4a90b8','stroke-width':.8},svg);

  // "Danube" label on river centreline, mid-chart
  tx('Danube',{x:scKm(950),y:ry(950)+5,'text-anchor':'middle',
    fill:'#4a90b8',font:`italic 9.5px ${SANS}`},svg);

  // "Black Sea" in left margin — text-anchor 'end' so it flows leftward from km=0 position
  tx('◀ Black Sea',{x:scKm(0)-4,y:ry(0)+5,'text-anchor':'end',
    fill:'#4a90b8',font:`9px italic ${SANS}`},svg);

  // Plants configuration
  // stemLen from river band edge to diamond tip
  const PLANTS=[
    {name:'Cernavodă', line1:'Romania · CANDU-6',   line2:'1,400 MW',
     km:299,  side:-1, stemLen:60, fill:'#7b2020', anc:'start'},
    {name:'Kozloduy',  line1:'Bulgaria · VVER-1000', line2:'~2,000 MW',
     km:793,  side:+1, stemLen:62, fill:'#1a3f6f', anc:'middle'},
    {name:'Paks',      line1:'Hungary · VVER-440',   line2:'1,880 MW',
     km:1531, side:-1, stemLen:60, fill:'#1a5c24', anc:'end'},
  ];

  PLANTS.forEach(p=>{
    const px=scKm(p.km), py=ry(p.km);
    const edgeY=p.side<0 ? py-B-1 : py+B+1;
    const tipY =p.side<0 ? edgeY-p.stemLen : edgeY+p.stemLen;

    // Stem
    ln(px,edgeY,px,tipY,{stroke:p.fill,'stroke-width':1.4},svg);

    // Diamond at tip
    const s=5.5;
    el('polygon',{
      points:`${px},${tipY-s*1.3} ${px+s},${tipY} ${px},${tipY+s*0.45} ${px-s},${tipY}`,
      fill:p.fill},svg);

    // Compute label x for each anchor type
    const lx= p.anc==='start' ? px+4 :
               p.anc==='end'   ? px-4 : px;

    // Spacing: labels stacked away from diamond
    const step=p.side<0 ? -13 : 13;
    const base=p.side<0 ? tipY-s*1.3-6 : tipY+s*0.45+15;

    tx(p.name, {x:lx,y:base,         'text-anchor':p.anc,fill:p.fill,font:`600 11px ${SANS}`},svg);
    tx(p.line1,{x:lx,y:base+step,    'text-anchor':p.anc,fill:p.fill,font:`9px ${SANS}`,opacity:.85},svg);
    tx(p.line2,{x:lx,y:base+step*2,  'text-anchor':p.anc,fill:p.fill,font:`9px ${SANS}`,opacity:.85},svg);
    tx(`km ${p.km.toLocaleString()}`,
               {x:lx,y:base+step*3,  'text-anchor':p.anc,fill:'#888',font:`8.5px ${MONO}`},svg);
  });

  // EFAS reference cell — circle on river, leader to label block
  // Positioned BELOW the river so it doesn't conflict with Paks (which is above)
  const efasKm=1507;
  const efasX=scKm(efasKm), efasY=ry(efasKm);
  // Leader goes down-left to a label well away from Paks stem
  const lx=efasX-52, ly=efasY+B+32;
  ln(efasX,efasY+B+2,lx+4,ly-5,{stroke:'#555','stroke-width':.9,'stroke-dasharray':'3,2'},svg);
  el('circle',{cx:efasX,cy:efasY,r:4.5,fill:'none',stroke:'#444','stroke-width':1.4},svg);
  el('circle',{cx:efasX,cy:efasY,r:1.5,fill:'#444'},svg);
  tx('EFAS ref. cell',   {x:lx,y:ly,      'text-anchor':'end',fill:'#333',font:`600 9px ${SANS}`},svg);
  tx('46.37°N  18.74°E', {x:lx,y:ly+11,   'text-anchor':'end',fill:'#555',font:`8.5px ${MONO}`},svg);
  tx('km 1,507',         {x:lx,y:ly+21,   'text-anchor':'end',fill:'#888',font:`8.5px ${MONO}`},svg);

  // km axis
  const axY=H-mb+10;
  ln(ml,axY,W-mr,axY,{stroke:'#aaa'},svg);
  [0,200,400,600,800,1000,1200,1400,1600].forEach(km=>{
    const ax=scKm(km);
    ln(ax,axY,ax,axY+4,{stroke:'#aaa'},svg);
    tx(km.toLocaleString(),{x:ax,y:axY+14,'text-anchor':'middle',fill:'#666',font:`9.5px ${SANS}`},svg);
  });
  tx('River kilometre from Sulina mouth (km)',
    {x:W/2,y:axY+27,'text-anchor':'middle',fill:'#555',font:`10.5px ${SANS}`},svg);
})();

/* ─────────────────────────────────────────────────────────────
   FIGURE 3  Copula vs independence joint return period
───────────────────────────────────────────────────────────── */
(function(){
  const W=700,H=310,ml=68,mr=26,mt=24,mb=56;
  const cw=W-ml-mr,ch=H-mt-mb; // 606 × 230
  const svg=document.getElementById('sv3');
  const g=el('g',{transform:`translate(${ml},${mt})`},svg);

  const Tmin=2,Tmax=30,RPmin=2,RPmax=900;
  const sX=T =>Math.log(T/Tmin)/Math.log(Tmax/Tmin)*cw;
  const sY=rp=>ch*(1-Math.log(rp/RPmin)/Math.log(RPmax/RPmin));

  el('rect',{x:0,y:0,width:cw,height:ch,fill:'#fafafa'},g);

  // Grid
  [2,5,10,20,50,100,200,500].forEach(rp=>{
    const y=sY(rp); if(y<0||y>ch) return;
    ln(0,y,cw,y,{stroke:'#e6e6e6','stroke-width':.8},g);
    tx(rp,{x:-7,y:y+3.5,'text-anchor':'end',fill:'#666',font:`10px ${SANS}`},g);
  });
  [2,5,10,15,20,30].forEach(T=>{
    const x=sX(T);
    ln(x,0,x,ch,{stroke:'#e6e6e6','stroke-width':.8},g);
    tx(T,{x,y:ch+14,'text-anchor':'middle',fill:'#666',font:`10px ${SANS}`},g);
  });
  ln(0,0,0,ch,{stroke:'#999'},g);
  ln(0,ch,cw,ch,{stroke:'#999'},g);

  // Copula family
  function copRP(T,tau){return Math.pow(T,Math.pow(2,1/(1/(1-tau))));}
  const Ts=[];for(let T=Tmin;T<=Tmax;T+=0.25)Ts.push(T);

  // Sensitivity band
  const btop=Ts.map(T=>{const r=copRP(T,.40);return r>RPmax?null:`${sX(T).toFixed(1)},${sY(r).toFixed(1)}`;}).filter(Boolean);
  const bbot=[...Ts].reverse().map(T=>{const r=copRP(T,.70);return r>RPmax?null:`${sX(T).toFixed(1)},${sY(r).toFixed(1)}`;}).filter(Boolean);
  el('polygon',{points:[...btop,...bbot].join(' '),fill:'#2166ac',opacity:.12},g);

  // Independence T²
  el('path',{d:'M '+Ts.map(T=>{const r=T*T;return r>RPmax?null:`${sX(T).toFixed(1)},${sY(r).toFixed(1)}`;}).filter(Boolean).join(' L '),
    fill:'none',stroke:'#888','stroke-width':1.8,'stroke-dasharray':'6,4'},g);

  // Copula bounds thin
  for(const tau of [.40,.70]){
    el('path',{d:'M '+Ts.map(T=>{const r=copRP(T,tau);return r>RPmax?null:`${sX(T).toFixed(1)},${sY(r).toFixed(1)}`;}).filter(Boolean).join(' L '),
      fill:'none',stroke:'#2166ac','stroke-width':.9,'stroke-dasharray':'3,4',opacity:.5},g);
  }

  // Main copula τ=0.55
  el('path',{d:'M '+Ts.map(T=>{const r=copRP(T,.55);return r>RPmax?null:`${sX(T).toFixed(1)},${sY(r).toFixed(1)}`;}).filter(Boolean).join(' L '),
    fill:'none',stroke:'#2166ac','stroke-width':2.2},g);

  // 2026 event markers
  const evT=29,evCop=copRP(29,.55),evInd=Math.min(29*29,RPmax);
  const ex=sX(evT),eyCop=sY(evCop),eyInd=sY(evInd);

  // Vertical connector between the two markers
  ln(ex,eyCop,ex,eyInd,{stroke:'#c0392b','stroke-width':.9,'stroke-dasharray':'3,3'},g);
  // Red solid dot — copula
  el('circle',{cx:ex,cy:eyCop,r:5.5,fill:'#c0392b',stroke:'#fff','stroke-width':1.5},g);
  // Hollow dot — independence
  el('circle',{cx:ex,cy:eyInd,r:4.5,fill:'#fff',stroke:'#888','stroke-width':1.8},g);

  // Annotation box — placed LEFT of the event line, clear of chart edges
  // Both annotations anchor at ex-12, on different y lines
  const ax=ex-12; // right edge of annotation text

  // Copula annotation — below the red dot
  tx('2026  ·  ~103 yr (copula)',{x:ax,y:eyCop+4,'text-anchor':'end',
    fill:'#c0392b',font:`600 9px ${SANS}`},g);

  // Independence annotation — below the hollow circle (which is near top of chart)
  // Place it well below the hollow circle so it doesn't overlap it
  const indLabelY=Math.max(eyInd+22, eyCop-28);
  tx('~841 yr (independence)',{x:ax,y:indLabelY,'text-anchor':'end',
    fill:'#666',font:`9px ${SANS}`},g);
  // leader from text to hollow dot
  ln(ax+1,indLabelY-3,ex-6,eyInd+5,{stroke:'#aaa','stroke-width':.8,'stroke-dasharray':'2,2'},g);

  // Axis labels
  el('text',{transform:'rotate(-90)',x:-ch/2,y:-54,'text-anchor':'middle',
    fill:'#555',font:`10.5px ${SANS}`},g).textContent='Joint return period (yr, log scale)';
  tx('Marginal return period T  (yr, log scale)',
    {x:cw/2,y:ch+42,'text-anchor':'middle',fill:'#555',font:`10.5px ${SANS}`},g);

  // Legend inside chart — top-left, where curves are low
  const lg=el('g',{transform:'translate(6,6)'},g);
  el('rect',{x:0,y:0,width:206,height:72,rx:2,
    fill:'#fff',stroke:'#ccc','stroke-width':.8,opacity:.93},lg);
  const legItems=[
    {type:'line',stroke:'#2166ac',sw:2.2,dash:'',     label:'Gumbel copula  τ = 0.55'},
    {type:'line',stroke:'#2166ac',sw:1, dash:'3,4',   label:'Sensitivity  τ ∈ {0.40, 0.70}',op:.6},
    {type:'line',stroke:'#888',   sw:1.8,dash:'6,4',  label:'Independence (T ²)'},
    {type:'dot', fill:'#c0392b',                       label:'2026 event'},
  ];
  legItems.forEach((item,i)=>{
    const ly=11+i*15;
    if(item.type==='line'){
      ln(7,ly,27,ly,{stroke:item.stroke,'stroke-width':item.sw,
        'stroke-dasharray':item.dash,opacity:item.op||1},lg);
    } else {
      el('circle',{cx:17,cy:ly,r:4.5,fill:item.fill,stroke:'#fff','stroke-width':1.2},lg);
    }
    tx(item.label,{x:32,y:ly+3.5,fill:'#333',font:`9px ${SANS}`},lg);
  });
})();

const tip=document.getElementById('tip');
</script>
